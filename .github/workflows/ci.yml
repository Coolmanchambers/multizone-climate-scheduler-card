name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: multizone-climate-scheduler-card
          path: dist/multizone-climate-scheduler-card.js

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          # brands: required only for HACS default-store listing, not for
          # custom-repository installs (post-v1 roadmap item).
          # images: README screenshot lands at the v1.0.0 acceptance pass;
          # drop this ignore then.
          ignore: brands images
