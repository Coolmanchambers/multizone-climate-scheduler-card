name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # This repo is public and its working copy lives beside a real Home
      # Assistant install. Generic checks only here - see the script's header.
      - run: npm run privacy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The committed bundle is what HACS serves between releases; a source
      # change pushed without a rebuild used to pass CI silently (0.7.7 review).
      - run: git diff --exit-code dist/
      - uses: actions/upload-artifact@v4
        with:
          name: multizone-climate-scheduler-card
          path: dist/multizone-climate-scheduler-card.js

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # @main is what HACS documents: validation rules evolve with HACS itself,
      # so a pinned tag would validate against stale requirements. Read-only
      # token; worst case is a CI-reliability blip, never the release artifact.
      - uses: hacs/action@main
        with:
          category: plugin
          # brands: required only for HACS default-store listing, not for
          # custom-repository installs (post-v1 roadmap item).
          ignore: brands
