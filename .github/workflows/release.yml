name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The committed bundle is what HACS serves between releases; a tag whose
      # source does not reproduce it is a broken release - fail loudly.
      - name: Verify committed bundle matches the source build
        run: git diff --exit-code dist/multizone-climate-scheduler-card.js
      # A tag carrying a semver pre-release identifier (v0.9.5-beta.1) is
      # published as a GitHub pre-release; a plain tag (v0.9.5) is not. HACS
      # hides pre-releases from anyone who has not enabled the repository's
      # "Pre-release" switch, so this is what keeps the beta channel opt-in
      # and stable users untouched. See docs/beta-testing.md.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/multizone-climate-scheduler-card.js
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
